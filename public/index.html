<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi tablero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233557d6'/><rect x='7' y='8' width='5' height='16' rx='2' fill='white'/><rect x='14' y='8' width='5' height='11' rx='2' fill='white' opacity='.8'/><rect x='21' y='8' width='5' height='7' rx='2' fill='white' opacity='.6'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="board-title">Mi tablero</h1>
      <p class="board-meta" id="board-meta"></p>
    </div>

    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar tareas o #etiquetas" autocomplete="off" />
      </label>

      <div class="chips" id="priority-filter" role="group" aria-label="Filtrar por prioridad">
        <button type="button" class="chip" data-priority="urgent" aria-pressed="false"><i class="dot p-urgent"></i>Urgente</button>
        <button type="button" class="chip" data-priority="high" aria-pressed="false"><i class="dot p-high"></i>Alta</button>
        <button type="button" class="chip" data-priority="medium" aria-pressed="false"><i class="dot p-medium"></i>Media</button>
        <button type="button" class="chip" data-priority="low" aria-pressed="false"><i class="dot p-low"></i>Baja</button>
      </div>

      <button type="button" class="btn btn-primary" id="add-column">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nueva columna
      </button>
      <button type="button" class="icon-btn" id="open-settings" aria-label="Configuración" title="Configuración">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="board" id="board" aria-live="polite">
    <p class="loading">Cargando tablero…</p>
  </main>

  <!-- Menú contextual de columna -->
  <div class="menu" id="column-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="edit">Editar columna</button>
    <button type="button" role="menuitem" data-action="sort-priority">Ordenar por prioridad</button>
    <button type="button" role="menuitem" data-action="sort-due">Ordenar por fecha límite</button>
    <hr />
    <button type="button" role="menuitem" data-action="delete" class="danger">Eliminar columna</button>
  </div>

  <!-- Diálogo de tarea -->
  <dialog id="task-dialog" class="dialog">
    <form method="dialog" id="task-form">
      <header class="dialog-head">
        <h2 id="task-dialog-title">Tarea</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span>Título</span>
        <input name="title" required maxlength="120" autocomplete="off" />
      </label>

      <label class="field">
        <span>Descripción</span>
        <textarea name="description" rows="4" maxlength="2000" placeholder="Detalles, enlaces, pasos…"></textarea>
      </label>

      <fieldset class="field">
        <legend>Prioridad</legend>
        <div class="segmented">
          <label><input type="radio" name="priority" value="low" /><span><i class="dot p-low"></i>Baja</span></label>
          <label><input type="radio" name="priority" value="medium" /><span><i class="dot p-medium"></i>Media</span></label>
          <label><input type="radio" name="priority" value="high" /><span><i class="dot p-high"></i>Alta</span></label>
          <label><input type="radio" name="priority" value="urgent" /><span><i class="dot p-urgent"></i>Urgente</span></label>
        </div>
      </fieldset>

      <div class="field-row">
        <label class="field">
          <span>Fecha límite</span>
          <input name="dueDate" type="date" />
        </label>
        <label class="field">
          <span>Columna</span>
          <select name="columnId"></select>
        </label>
      </div>

      <label class="field">
        <span>Etiquetas <small>(separadas por comas)</small></span>
        <input name="tags" placeholder="trabajo, casa, compras" autocomplete="off" />
      </label>

      <p class="form-error" role="alert" hidden></p>

      <footer class="dialog-foot">
        <button type="button" class="btn btn-danger-ghost" id="delete-task">Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="task-submit">Guardar</button>
      </footer>
    </form>
  </dialog>

  <!-- Diálogo de columna -->
  <dialog id="column-dialog" class="dialog dialog-sm">
    <form method="dialog" id="column-form">
      <header class="dialog-head">
        <h2 id="column-dialog-title">Nueva columna</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span>Nombre</span>
        <input name="name" required maxlength="40" autocomplete="off" placeholder="Ej. Esperando respuesta" />
      </label>

      <fieldset class="field">
        <legend>Color</legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>

      <label class="field">
        <span>Límite de tareas en curso <small>(opcional)</small></span>
        <input name="wipLimit" type="number" min="1" max="99" placeholder="Sin límite" />
      </label>

      <p class="form-error" role="alert" hidden></p>

      <footer class="dialog-foot">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="column-submit">Crear columna</button>
      </footer>
    </form>
  </dialog>

  <!-- Diálogo de configuración -->
  <dialog id="settings-dialog" class="dialog dialog-sm">
    <form method="dialog" id="settings-form">
      <header class="dialog-head">
        <h2>Configuración</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <fieldset class="field">
        <legend>Tema</legend>
        <div class="theme-grid" id="theme-options" role="radiogroup" aria-label="Tema de la interfaz"></div>
      </fieldset>

      <footer class="dialog-foot">
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" data-close>Listo</button>
      </footer>
    </form>
  </dialog>

  <!-- Diálogo eliminar columna -->
  <dialog id="delete-column-dialog" class="dialog dialog-sm">
    <form method="dialog" id="delete-column-form">
      <header class="dialog-head">
        <h2 id="delete-column-title">Eliminar columna</h2>
      </header>
      <div id="delete-column-body"></div>
      <footer class="dialog-foot">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn btn-danger">Eliminar columna</button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <template id="column-template">
    <section class="column">
      <header class="column-head" draggable="true">
        <span class="column-color"></span>
        <h2 class="column-name"></h2>
        <span class="column-count"></span>
        <button type="button" class="icon-btn column-menu-btn" aria-label="Opciones de columna" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
      </header>
      <div class="meter" aria-hidden="true"></div>
      <ol class="task-list"></ol>
      <form class="quick-add">
        <input name="title" maxlength="120" placeholder="Agregar tarea…" autocomplete="off" aria-label="Título de la nueva tarea" />
        <button type="submit" class="icon-btn" aria-label="Agregar tarea">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
    </section>
  </template>

  <template id="theme-option-template">
    <button type="button" class="theme-option" role="radio" aria-checked="false">
      <span class="theme-preview" aria-hidden="true"></span>
      <span class="theme-text">
        <strong class="theme-name"></strong>
        <small class="theme-desc"></small>
      </span>
    </button>
  </template>

  <template id="task-template">
    <li class="task" draggable="true" tabindex="0">
      <p class="task-title"></p>
      <div class="task-meta"></div>
    </li>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
